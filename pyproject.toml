[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spxrnd"
version = "0.1.0"
description = "SPX option-chain collection and risk-neutral density estimation"
requires-python = ">=3.11"

# Deliberately empty. The `ingest` component is stdlib-only so the collector can
# be deployed anywhere and cannot break from a dependency upgrade. This is
# enforced by tests/test_ingest_is_stdlib_only.py, not by convention.
dependencies = []

[project.optional-dependencies]
analysis = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.1",
    "pyarrow>=14",
    "duckdb>=0.10",
    # DuckDB needs pytz to materialise a TIMESTAMP WITH TIME ZONE into a Python
    # datetime. Without it every fetchall() touching capture_utc raises. The
    # alternative was storing naive UTC and dropping the zone, which trades a
    # 500 KB dependency for a schema that no longer says what it means.
    "pytz>=2024.1",
]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.4",
]

[project.scripts]
spxrnd = "spxrnd.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "live: hits the real CBOE endpoint; excluded from the default suite",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    # The module-level script guard. Unreachable under pytest by construction,
    # and covering it would mean re-executing the module as __main__ purely to
    # satisfy a counter. `tests/cli` runs the real thing via subprocess.
    'if __name__ == "__main__":',
]

[tool.ruff]
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
